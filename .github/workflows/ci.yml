name: Flask App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t devops-project .

      - name: Run Docker container
        run: |
          docker run -d --name devops-ci-test -p 5000:5000 devops-project

      - name: Test running container
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-ci-test
          exit 1

      - name: Stop and remove container
        if: always()
        run: docker rm -f devops-ci-test || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image for Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag devops-project:latest ayux1/devops-project:${{ github.sha }}
          docker tag devops-project:latest ayux1/devops-project:latest

      - name: Push versioned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ayux1/devops-project:${{ github.sha }}

      - name: Push latest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ayux1/devops-project:latest

      - name: Log in to Azure using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az containerapp update \
            --name devops-flask-app \
            --resource-group rg-devops-project \
            --image docker.io/ayux1/devops-project:${{ github.sha }}
