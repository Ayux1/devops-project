
name: Flask App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t devops-project .

      - name: Run Docker container
        run: |
          docker run -d --name devops-ci-test -p 5000:5000 devops-project

      - name: Test running container
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-ci-test
          exit 1

      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f devops-ci-test || true


